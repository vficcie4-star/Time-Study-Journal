<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal & Stop Watch</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header with Time and Date -->
        <div class="header">
            <div class="time-date-container">
                <div id="currentTime" class="current-time">00:00:00</div>
                <div id="currentDate" class="current-date">01-JAN-2026</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
            <button id="notesBtn" class="btn btn-warning">Notes</button>
            <button id="countBtn" class="btn btn-info">Count</button>
            <button id="exportCSVBtn" class="btn btn-success">Export CSV</button>
        </div>

        <!-- Table Container -->
        <div class="table-container">
            <table id="journalTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Product</th>
                        <th>Process</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Paused Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be added here -->
                </tbody>
                <tfoot id="tableFooter">
                    <tr>
                        <td colspan="7" style="padding: 10px;">
                            <button id="addRowBtn" class="btn btn-primary add-bottom-btn">+ Add Time</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Modal for detailed form -->
    <div id="formModal" class="modal">
        <div class="modal-content form-modal">
            <div class="modal-header">
                <h3 id="formModalTitle">Entry Details</h3>
                <div class="modal-actions">
                    <button id="formCancelBtn" class="btn btn-danger btn-sm">Cancel</button>
                    <button id="formSaveBtn" class="btn btn-primary btn-sm">Save</button>
                </div>
            </div>
            <div class="modal-body">
                <form id="entryForm" class="entry-form">
                    <div class="form-group">
                        <label for="formSection">Section</label>
                        <input type="text" id="formSection" placeholder="Enter Section" autocomplete="off">
                        <div id="sectionSuggestions" class="suggestions-list"></div>
                    </div>
                    <div class="form-group">
                        <label for="formProduct">Product</label>
                        <input type="text" id="formProduct" placeholder="Enter Product" autocomplete="off">
                        <div id="productSuggestions" class="suggestions-list"></div>
                    </div>
                    <div class="form-group">
                        <label for="formSKU">SKU</label>
                        <input type="text" id="formSKU" placeholder="Enter SKU" autocomplete="off">
                        <div id="skuSuggestions" class="suggestions-list"></div>
                    </div>
                    <div class="form-group">
                        <label for="formProcess">Process</label>
                        <textarea id="formProcess" rows="3" placeholder="Enter Process Details"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="formWorkUnit">Work Unit</label>
                        <input type="text" id="formWorkUnit" placeholder="Enter Work Unit" autocomplete="off">
                        <div id="workUnitSuggestions" class="suggestions-list"></div>
                    </div>
                    <div class="form-group">
                        <label for="formOprt">Oprt</label>
                        <input type="text" id="formOprt" placeholder="Enter Oprt">
                    </div>
                    <div class="form-group">
                        <label for="formMTE">MTE</label>
                        <input type="text" id="formMTE" placeholder="Enter MTE">
                    </div>
                    <div class="form-group">
                        <label for="formRemarks">Remarks</label>
                        <textarea id="formRemarks" rows="3" placeholder="Enter Remarks"></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notesModal" class="modal">
        <div class="modal-content notes-modal">
            <div class="modal-header">
                <h3>📝 Notes</h3>
                <div class="modal-actions">
                    <button id="notesCancelBtn" class="btn btn-danger btn-sm">Cancel</button>
                    <button id="notesSaveBtn" class="btn btn-primary btn-sm">Save</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="notes-info">
                    <small>Last saved: <span id="notesLastSaved">Never</span></small>
                </div>
                <textarea id="notesTextArea" rows="15" placeholder="Write your notes here..."></textarea>
                <div class="notes-word-count">
                    Words: <span id="wordCount">0</span> | Characters: <span id="charCount">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Count Modal -->
    <div id="countModal" class="modal">
        <div class="modal-content count-modal">
            <div class="modal-header">
                <h3>🔢 Count Transactions</h3>
                <div class="modal-actions">
                    <button id="countCancelBtn" class="btn btn-danger btn-sm">Cancel</button>
                    <button id="countSaveBtn" class="btn btn-primary btn-sm">Save All</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="count-info">
                    <small>Select a transaction # to start counting</small>
                </div>
                <div class="count-table-container">
                    <table class="count-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Transaction</th>
                                <th>Count</th>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Paused Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="countTableBody">
                            <!-- Count rows will be added here -->
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7" style="padding: 8px;">
                                    <button id="addCountRowBtn" class="btn btn-primary add-count-btn">+ Add Count</button>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Drag handle indicator -->
    <div id="dragIndicator" class="drag-indicator">⋮⋮</div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
