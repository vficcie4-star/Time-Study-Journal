<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal & Stop Watch</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header with Time and Date -->
        <div class="header">
            <div class="time-date-container">
                <div id="currentTime" class="current-time">00:00:00</div>
                <div id="currentDate" class="current-date">01-JAN-2026</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="addRowBtn" class="btn btn-primary">+ Add Time</button>
            <button id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
            <button id="exportCSVBtn" class="btn btn-success">Export CSV</button>
        </div>

        <!-- Table Container -->
        <div class="table-container">
            <table id="journalTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Product</th>
                        <th>SKU</th>
                        <th>Section</th>
                        <th>Process</th>
                        <th>Oprt</th>
                        <th>MTE</th>
                        <th>Work Unit</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Paused Time</th>
                        <th>Remarks</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be added here -->
                </tbody>
            </table>
        </div>

        <!-- Modal for expanded remarks -->
        <div id="remarksModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Remarks</h3>
                    <button class="modal-close" onclick="closeRemarksModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <textarea id="remarksTextarea" placeholder="Enter your remarks here..."></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="saveRemarks()">Save</button>
                    <button class="btn btn-danger" onclick="closeRemarksModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
