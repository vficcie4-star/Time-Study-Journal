<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal & Stop Watch</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header with Time and Date -->
        <div class="header">
            <div class="time-date-container">
                <div id="currentTime" class="current-time">00:00:00</div>
                <div id="currentDate" class="current-date">01-JAN-2026</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
            <button id="exportCSVBtn" class="btn btn-success">Export CSV</button>
        </div>

        <!-- Table Container -->
        <div class="table-container">
            <table id="journalTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Product</th>
                        <th>Process</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Paused Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be added here -->
                </tbody>
                <!-- Footer with Add Time button -->
                <tfoot id="tableFooter">
                    <tr>
                        <td colspan="7" style="padding: 10px;">
                            <button id="addRowBtn" class="btn btn-primary add-bottom-btn">+ Add Time</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Modal for Product Details -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="productModalTitle">Product Details</h3>
                <div class="modal-actions">
                    <button id="productModalCancelBtn" class="btn btn-danger btn-sm">Cancel</button>
                    <button id="productModalDoneBtn" class="btn btn-primary btn-sm">Done</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Product</label>
                    <input type="text" id="modalProduct" class="modal-input" placeholder="Enter Product">
                </div>
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" id="modalSKU" class="modal-input" placeholder="Enter SKU">
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="modalSection" class="modal-input" placeholder="Enter Section">
                </div>
                <div class="form-group">
                    <label>Process</label>
                    <textarea id="modalProcess" class="modal-textarea" rows="3" placeholder="Enter Process"></textarea>
                </div>
                <div class="form-group">
                    <label>Oprt</label>
                    <input type="text" id="modalOprt" class="modal-input" placeholder="Enter Oprt">
                </div>
                <div class="form-group">
                    <label>MTE</label>
                    <input type="text" id="modalMTE" class="modal-input" placeholder="Enter MTE">
                </div>
                <div class="form-group">
                    <label>Remarks</label>
                    <textarea id="modalRemarks" class="modal-textarea" rows="3" placeholder="Enter Remarks"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
